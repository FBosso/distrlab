[project]
name = "distrlab"
version = "0.1.0"
description = "Template for experimenting locally and scaling to an HPC cluster with the same PyTorch DDP training stack."
authors = [{ name = "FBosso" }]
license = "MIT"
requires-python = ">=3.11,<3.14" # hydra-core's argparse setup breaks on 3.14 (as of hydra-core 1.3.2)
dependencies = [
    "torch>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fsspec>=2024.6",
    "matplotlib>=3.9",
]